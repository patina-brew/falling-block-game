name: ears-bdd
version: 1
description: 日本語、EARS、Gherkin、テスト駆動に基づく共通の開発手順

artifacts:
  - id: proposal
    generates: proposal.md
    description: 目的、変更内容、対象外、対象の仕様、影響、未決事項
    template: proposal.md
    instruction: |
      目的には、誰がどの場面で何に困っており、なぜ今この変更が必要かを書く。
      1つの変更は1つの検証可能な目的に絞り、単独でアーカイブでき、アーカイブした時点でプロダクトが動く大きさにする。
      変更内容には振る舞いの追加、変更、廃止を書き、互換性を壊す場合は **BREAKING** と移行先を書く。
      対象外には、今回実現しない範囲と理由を書く。
      実装方法は design.md に書き、ここには書かない。
      対象の仕様を書く前に `openspec list --specs` で既存の仕様書を確認し、新しい capability を作るより既存の仕様書への追加を優先する。
      既存の capability は `openspec/specs/` のパスと完全に一致させる。
      新しい capability の名前は、利用者から見た機能を表す kebab-case の名詞とし、階層を作らない。
      変更後に1つの仕様書の要件が15個を超える場合は、分割を提案する。
      対象の仕様が1つもない場合は作成を止め、change が必要かを利用者に確認する。
      利用者の依頼で決まっていない事項(数値、異常時の動作、表示、範囲の境界など)は、依頼に書かれていなくても、推測で確定せずに未決事項に書く。
      案がある場合は、案とその理由も書く。
      未決事項のうち実装を止める事項は "停止:" で始め、確認先を書く。
      停止にするのは、決まらないと要件や設計が大きく変わる事項に限り、表示の文言や調整できる値のように後から変えやすい事項は仮に決めて、停止にしない未決事項として書く。
      未決事項が解決したら、結論を該当する成果物に反映し、項目を削除する。
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: EARS の要件と Gherkin のシナリオによる差分仕様
    template: spec.md
    instruction: |
      proposal.md の対象の仕様ごとに specs/<capability>/spec.md を作成する。
      新しい capability だけに ## Purpose を50文字以上で書き、既存の capability の差分には書かない。
      見出しは `### Requirement: REQ-001 - <名称>` と `#### Scenario: REQ-001-S01 - <名称>` の形式とし、シナリオの # は必ず4つにする。
      1つの要件には1つの振る舞いだけを定義し、本文は500文字以内にする。
      要件の本文は EARS で書き、次の形式から条件に合うものを選ぶ。
      組み合わせてもよい。
      - 常時: <主体>は、<応答>しなければならない(SHALL)。
      - イベント: WHEN <契機>とき、<主体>は<応答>しなければならない(SHALL)。
      - 状態: WHILE <状態>の間、<主体>は<応答>しなければならない(SHALL)。
      - 異常: IF <異常な条件>場合、THEN <主体>は<応答>しなければならない(SHALL)。
      - 任意機能: WHERE <機能や設定>が有効な場合、<主体>は<応答>しなければならない(SHALL)。
      シナリオは Gherkin で書き、`- **GIVEN**`、`- **WHEN**`、`- **THEN**`、`- **AND**` の箇条書きにする。
      GIVEN には前提、WHEN には1つの契機、THEN には利用者や外部から観測できる結果を書き、1つのシナリオには1つの判断だけを書く。
      各要件について正常、境界、異常の観点を検討し、該当する観点のシナリオを書く。
      要件の本文に書いた条件は、それぞれ少なくとも1つのシナリオで確かめる。
      複数の項目に同じ条件を適用する場合は、項目ごとの例を1つのシナリオの中の例の表にまとめ、項目の抜けを作らない。
      例の表には、項目ごとに判断が分かれる値だけを書き、同じ判断になる値を並べない。
      それ以外のシナリオは判断が分かれる例と境界に絞り、同じ判断の言い換えを増やさない。
      THEN には、誤った振る舞いと区別できる具体的な結果を書く。
      非機能要件には、対象データ、実行環境、指標、合格基準を書く。
      実装のクラス、関数、ライブラリ、処理手順は書かない。
      要件とシナリオには、利用者や外部との約束になる振る舞いだけを書く。
      入力の有効範囲、出力の形式と内容、終了コード、互換性、非機能要件の合格基準など、変えると約束が変わる値は要件に書く。
      見た目の寸法や色、更新の頻度、設定の既定値、内部の上限や待ち時間など、約束を変えずに調整できる値は要件に書かず、design.md に書く。
      調整できる値に関わるシナリオは、"設定した上限を超えない" のように値の役割で書き、値そのものを結果に書かない。
      MODIFIED では正式仕様の要件ブロックを全シナリオごと複写し、見出しを一致させたまま変更を反映する。
      既存のシナリオの名前を変える場合や、シナリオを削除する場合も、変更後の内容をそのまま MODIFIED に書く。
      OpenSpec は、正式仕様にある名前のシナリオが MODIFIED にないと validate と archive を拒否するが、tasks.md で正式仕様を先に更新して解消するため、未決事項にしない。
      REMOVED には **Reason** と **Migration**、RENAMED には FROM と TO を書く。
      利用者が決めていない約束の数値や動作は推測で確定せず、proposal.md の未決事項に追記する。
      利用者が判断を委ねた事項は決めてよく、決めた内容を仕様に書く。
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 設計判断、昇格の要否、シナリオごとの検証方法
    template: design.md
    instruction: |
      小さな変更でも作成し、判断が少なければ短く書く。
      背景と制約には、今回必要な補足だけを書く。
      設計判断は D-01 から採番し、選択、理由、代替案、昇格を書く。
      調整できる値は、値、理由、定義する場所(コードの定数か設定ファイルの1か所)を設計判断に書く。
      design.md は決めた時点の記録であり、archive の後の現在の値は、定義した場所を正とする。
      昇格には、プロジェクト全体の原則にする場合は反映先を `openspec/tech.md の <節の名前>` または `openspec/structure.md の <節の名前>` の形式で、しない場合は "なし" と書く。
      検証計画には、差分仕様の ADDED と MODIFIED に含まれる全シナリオを1行ずつ書き、設計判断の列には関係する D-xx を `、` でつないで書き、なければ "なし" とする。
      検証方法は "自動テスト" または "実機確認" とし、テストのファイル名は書かない。
      実機確認の具体的な内容は manual-checks.md に書く。
      該当しない観点の理由と、非機能要件の測定手順は、検証計画の表の下に書く。
      検証計画の表の下に、自動テストのシナリオを確かめる層(部品、処理の流れ、コマンドなど)を書き、同じシナリオを複数の層で確かめない(部品のつながりの確認を除く)。
      リスクと移行には、リスクと対処、移行がある場合はその手順と失敗時に戻す方法を書く。
      設計中に見つかった未決事項は、実装を止めるものも止めないものも、proposal.md の未決事項に追記する。
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: テスト駆動の順序で並べた実装、文書更新、検証の作業
    template: tasks.md
    instruction: |
      各タスクは `- [ ] X.Y` の形式の1行で書き、番号を文書内で一意にする。
      実装のグループは依存順に並べ、見出しに対象のシナリオIDを書く。
      自動テストのシナリオは、テストの作成と失敗の確認、実装と成功の確認の順にタスクにする。
      実装を変えない変更では、失敗の確認に代えて、テストが誤りを検出できることの確認をタスクにする。
      各タスクには完了の確認方法を書く。
      MODIFIED で内容を変えたシナリオは、既存テストの見直しをタスクにする。
      削除する要件やシナリオは、そのIDを持つテストと manual-checks.md の行の削除をタスクにする(別の capability へ移す要件を除く)。
      実機確認のシナリオは manual-checks.md への追加をタスクにし、MODIFIED の場合は状態を "未確認" に戻すタスクにする。
      実機確認の実施と結果の記録はタスクにせず、archive の後に利用者が行う。
      MODIFIED で既存のシナリオの名前を変えた要件や、シナリオを削除した要件は、実装と文書の更新の後、全体検証の前に、正式仕様の要件ブロックを差分仕様と同じ内容に置き換えるタスクにする。
      このタスクの確認は、`npx --no-install openspec validate <変更名> --strict` の成功とする(archive は同じ内容の要件を同期済みとして扱う)。
      昇格がある設計判断は、いずれかのグループに tech.md または structure.md を更新するタスクを入れる。
      capability を追加または削除する場合は、specs/README.md を更新するタスクを入れる。
      specs/README.md と昇格先の文書には、archive の後の状態を書き、進行中の変更や change の名前を書かない。
      最後のグループには、全体検証だけを置く。
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    tasks.md の未完了のタスクを依存順に実施し、完了の確認ができたタスクだけをチェックする。
